[package]
name = "atelier-sim"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"
description = "Genzineers Atelier cloth solver (small-step PBD) compiled to WebAssembly"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
